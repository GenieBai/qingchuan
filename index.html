<script>
/* =========================================================
   青川三中 · ARG  v1.1（修复版）
========================================================= */
const $=s=>document.querySelector(s);
const KEY='qc3v1', EKEY='qc3en';

const persist=()=>{ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} };

const ROSTER=[
[1979,'苏怀瑾','建校日的第一位'],[1980,'白望舒',''],[1981,'陈延龄',''],[1982,'傅雪衣','档案缺页'],

[1990,'柴敬亭',''],[1991,'阮清梧',''],[1992,'孟迟',''],[1993,'许听澜',''],
[1994,'桑无邪',''],[1995,'邵鹤年',''],[1996,'秦昼','他后来回来当代校长'],
[1997,'谢重光',''],[1998,'霍小满',''],[1999,'严冬岭',''],[2000,'蒋一苇',''],

[2005,'米兰舟',''],[2006,'闻人静',''],[2007,'柏舟',''],[2008,'从莘',''],
[2009,'迟迟',''],[2010,'商略',''],[2011,'郁离',''],[2012,'简兮',''],
[2013,'敖彻',''],[2014,'宛丘',''],[2015,'池鱼',''],[2016,'归荑',''],

];
const TEACHERS=['秦昼','华敛','陈守拙','温言','洛平','祝余','郑还','白术','关山','铁凉'];
const ALLREAD=()=>['roster','log','painting','rollcall','leave','note'].every(k=>S.lynchRead[k]);
const KEYSET=['home','about','news','teachers','culture','rules','history','library','psych','academic'];
const sumKey=()=>Object.keys(S.time).reduce((t,k)=>t+(KEYSET.includes(k.split('/')[0])?S.time[k]:0),0);

const AE={
  ctx:null,master:null,muted:localStorage.getItem('qcmute')==='1',
  amb:[],creakT:null,heartT:null,
  init(){ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:1; this.master.connect(this.ctx.destination); }
    if(this.ctx.state==='suspended')this.ctx.resume(); },
  toggle(){ this.muted=!this.muted; try{localStorage.setItem('qcmute',this.muted?'1':'0')}catch(e){}
    if(this.master)this.master.gain.value=this.muted?0:1; $('#mute').textContent='音效：'+(this.muted?'关':'开'); },
  env(t0,g,dur){const gn=this.ctx.createGain();gn.gain.setValueAtTime(g,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);gn.connect(this.master);return gn},
  tone(f0,f1,dur,g,type='sine',t0){ if(!this.ctx)return; t0=t0||this.ctx.currentTime;
    const o=this.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    o.connect(this.env(t0,g,dur));o.start(t0);o.stop(t0+dur+.05) },
  noise(dur,g,f,type='lowpass'){ if(!this.ctx)return; const t0=this.ctx.currentTime,n=this.ctx.sampleRate*dur|0;
    const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource();s.buffer=b;
    const filt=this.ctx.createBiquadFilter();filt.type=type;filt.frequency.value=f;
    s.connect(filt);filt.connect(this.env(t0,g,dur));s.start(t0) },
  click(){ this.init(); if(this.ctx)this.noise(.05,.05,900) },
  chime(){ this.init(); this.tone(523,null,1.6,.08); this.tone(784,null,2.2,.05) },
  sting(){ this.init(); this.tone(2200,180,.35,.16,'sawtooth'); this.noise(.25,.1,3000,'highpass') },
  scream(){ this.init(); this.tone(400,2400,.5,.22,'sawtooth'); this.tone(3000,90,.6,.18); this.noise(.6,.14,2500,'bandpass') },
  bell(){ this.init(); [523,659,784].forEach((f,i)=>setTimeout(()=>this.tone(f,null,2.6,.09),i*350)) },
  chalk(){ this.init(); for(let i=0;i<7;i++)setTimeout(()=>this.noise(.09,.12,3500,'highpass'),i*260) },
  droneStart(){ this.init(); if(!this.ctx||this.amb.length)return;
    const g=this.ctx.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.14,this.ctx.currentTime+4);g.connect(this.master);
    [[55,'sine'],[55.8,'sine'],[110.3,'triangle']].forEach(([f,t])=>{const o=this.ctx.createOscillator();o.type=t;o.frequency.value=f;o.connect(g);o.start();this.amb.push(o)});
    const n=this.ctx.sampleRate*2|0,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource();s.buffer=b;s.loop=true;
    const fl=this.ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=180;
    const ng=this.ctx.createGain();ng.gain.value=.35;s.connect(fl);fl.connect(ng);ng.connect(g);s.start();
    this.amb.push(s); this.ambG=g;
    this.creakT=setInterval(()=>{ if(Math.random()<.5)this.tone(140,88,.5,.06,'sawtooth');
      if(Math.random()<.25)this.noise(1.1,.03,1400,'bandpass') },9000); },
  droneStop(){ if(!this.ctx)return; if(this.ambG){this.ambG.gain.linearRampToValueAtTime(0,this.ctx.currentTime+2)}
    const A=this.amb; setTimeout(()=>A.forEach(x=>{try{x.stop()}catch(e){}}),2300); this.amb=[];
    clearInterval(this.creakT);this.creakT=null },
  heart(ms){ this.stopHeart(); this.heartT=setInterval(()=>{ if(!this.ctx)return;
    this.tone(58,null,.16,.3); setTimeout(()=>this.tone(50,null,.14,.2),190) },ms) },
  stopHeart(){ if(this.heartT){clearInterval(this.heartT);this.heartT=null} },
  stopAll(){ this.droneStop(); this.stopHeart() }
};

let typeGen=0;
function typeLines(el,lines,done){ const g=++typeGen; let li=0;
  function next(){ if(g!==typeGen)return;
    if(li>=lines.length){ if(g===typeGen&&done)done(); return }
    const row=document.createElement('div'); el.appendChild(row);
    const span=document.createElement('span'); row.appendChild(span);
    const cursor=document.createElement('i'); cursor.className='cursor'; row.appendChild(cursor);
    const text=lines[li]; let ci=0;
    const tm=setInterval(()=>{ if(g!==typeGen){clearInterval(tm);return}
      if(AE.ctx&&!AE.muted&&Math.random()<.4)AE.noise(.02,.02,2500,'highpass');
      span.textContent=text.slice(0,++ci);
      if(ci>=text.length){ clearInterval(tm); cursor.remove(); li++; setTimeout(next, li<lines.length-1?420:200) } },42) }
  next() }

function lynchGuard(){
 if(!S.auth){ S.tres++; persist();
  if(S.tres>=3){ endGame('intruder'); return }
  flash(); AE.sting();
  toast(S.tres===1
    ?'［201 室］门纹丝不动。这扇门只认教师的卡——先在教务系统登录教工账号，再回到这扇门前来。'
    :'［201 室］你又来了。门缝后面有人在看你。下一次，就不会只是"拒绝"这么简单了。',true);
  setTimeout(()=>{ if(route()==='201')location.hash='#/' },1000); return }
 if(S.auth.role!=='t'){ toast('［201 室］学生的卡刷不开这扇门。你需要借一张教师的卡。',true);
  setTimeout(()=>{ if(route()==='201')location.hash='#/' },1000); return }
 if(sumKey()<45000){ S.shallowN=(S.shallowN||0)+1; persist();
  if(S.shallowN>=2){ endGame('witness'); return }
  flash(); AE.sting();
  toast('［201 室］门开了一条缝，又合上了。里面有人说：你来得太快，看得太少。回去把校史、守则、通知和信都看完再来。（不会有第三次提醒。）',true);
  setTimeout(()=>{ if(route()==='201')location.hash='#/' },1200); return }
 if(!S.introDone){ S.introDone=true; persist();
  const ov=$('#overlay'); ov.classList.add('on'); ov.innerHTML='<div id="type-layer"></div>';
  typeLines($('#type-layer'),['> 接入点：档案馆 201 室（门牌已正过来）','> 身份核验：教工 T-0870714 …… 通过','> 欢迎。','> 你来得比点名晚，但比散场早。','> 请慢慢看。先生不催。'],()=>{ ov.classList.remove('on'); ov.innerHTML=''; renderLynch() });
  return }
 renderLynch() }

   box.innerHTML=out },
 /* —— 里网 —— */
 ldoc(t){ S.lynchTab=t.dataset.k; S.lynchRead[t.dataset.k]=1; persist(); if(AE.ctx)AE.noise(.08,.06,700); renderLynch() },
 rollcall(){ const n=($('#rcname').value||'').replace(/\s+/g,'');
   if(!n){toast('先生在等一个名字。',true);return}
   S.called=n; S.cd=Date.now()+180000; persist(); document.body.classList.add('hunted');
   AE.sting(); AE.heart(900); renderLynch() },
 leave(){ const n=($('#lvname').value||'').replace(/\s+/g,'');
   if(!n){$('#lvmsg').textContent='请填写姓名。';return}
   if(n==='沈叙'){$('#lvmsg').textContent='驳回：你还坐在教室里。';return}
   if(S.called&&n===S.called){$('#lvmsg').textContent='驳回：你今天刚刚应到。';return}
   if(n.includes('先生')||n.includes('守拙')){$('#lvmsg').textContent='驳回：他不能退学。他已经是这间教室了。';AE.sting();return}
   const on=ROSTER.find(r=>r[1]===n);
   if(on){ S.cd=null; AE.stopHeart(); document.body.classList.remove('hunted'); endGame('graduate',n) }
   else { S.denyN++; $('#lvmsg').textContent=S.denyN>=3?'驳回：查无此人。（试试那些再也没回来上课的名字。）':'驳回：查无此人。档案科不予受理。' } },
 take(){ if(!ALLREAD())return; endGame('successor') },
 lynchout(){ if(S.cd){ modal(`<p style="margin-bottom:18px">点名进行中。此刻离校，没有人替你签到。<b style="color:var(--lyn-red2)">钟不会停。</b>确认要翻墙离开吗？</p><button class="lyn-btn" style="margin-left:0" data-act="lynchout2">确 认</button>`) }
   else modal(`<p style="margin-bottom:18px">离校须先办理手续（见【退学申请】）。未办手续者强行离校的，会被记为"逃课"。</p><button class="lyn-btn" style="margin-left:0" data-act="lynchout2">仍要离开</button>`) },
 lynchout2(){ mclose(); document.body.classList.remove('inlyn'); AE.droneStop(); location.hash='#/'; toast('你听见了身后的脚步声。',true) },
 mute(){ AE.toggle() },
 restart(){ softReset(false) },
 toarchive(){ softReset(true) },
 mclose(){ mclose() }
};
document.addEventListener('click',e=>{ AE.init(); const el=e.target.closest('[data-act]');
 if(el&&ACT[el.dataset.act]){ if(el.dataset.act!=='mute')AE.click(); ACT[el.dataset.act](el,e) } });
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){
  const t=route(); const ae=document.activeElement;
  if(t.startsWith('library'))ACT.search();
  else if(t==='201'&&S.lynchTab==='rollcall')ACT.rollcall();
  else if(t==='201'&&S.lynchTab==='leave')ACT.leave();
  else if(t==='academic'&&S.auth&&ae&&ae.id==='stuq')ACT.stuq();
  else if(t==='academic'&&!S.auth)ACT.login() } });

/* =========================================================
   路由主循环与全局钟
========================================================= */
function render(){
  if(S.ended){ showEnding(S.ended); return }
  typeGen++;
  const r=route();
  tickTime(r||'home');
  if(S.cd&&Date.now()>S.cd){ endGame('noname'); return }
  mclose();
  const ov=$('#overlay');
  if(ov.classList.contains('on')&&$('#type-layer')){ ov.classList.remove('on'); ov.innerHTML='' }
  if(r==='201'){ lynchGuard(); return }
  document.body.classList.remove('inlyn'); AE.droneStop();
  if(!S.cd){ document.body.classList.remove('hunted'); AE.stopHeart() }
  const base=r.split('/')[0];
  let html;
  if(r==='news')html=V['news']();
  else if(base==='news')html=V['news/'](+r.split('/')[1]);
  else html=(V[r]||V[base]||V['404'])();
  $('#app').innerHTML=html;
  document.title='青川市第三高级中学 | 官方网站';
  window.scrollTo(0,0) }
window.addEventListener('hashchange',render);

setInterval(()=>{ if(S.cd){ const left=Math.ceil((S.cd-Date.now())/1000);
  if(left<=0){ endGame('noname'); return }
  document.body.classList.add('hunted');
  const el=$('#cdtext'); if(el)el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}` } },1000);

render();
</script>
</body>
</html>
